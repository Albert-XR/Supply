# This will be the first part of the title tag for your site <title> site.name + page.title </title>
title: "DINGYONG"
description: "Professional manufacturer of stainless steel cutlery, flatware and kitchen tools for hotels, restaurants and retail brands"
email: sales@ding-yong.com
url: "https://www.ding-yong.com" # the base hostname & protocol for your site, e.g. http://example.com, also used in jekyll-seo-tag
baseurl: ""
google_analytics_key: "G-ZF0WEH06MP"
# Microsoft Clarity 热力图/录屏（在 clarity.microsoft.com 创建项目后填入项目 ID，留空则不加载）
clarity_key: "ykn7d1093k"

# Values for the jekyll-seo-tag gem (https://github.com/jekyll/jekyll-seo-tag)
logo: /siteicon.png
tagline: "Professional Manufacturer"
author:
  name: DINGYONG
  email: sales@ding-yong.com
  phone: "+8615013371880"

# Build settings
markdown: kramdown
timezone: Asia/Shanghai

collections:
  products:
    _hide_content: false
    output: true

permalink: /:title/ # pretty

defaults:
  -
    scope:
      path: ""
      type: "products"
    values:
      layout: "product"
  -
    scope:
      path: ""
    values:
      layout: "page"
  -
    scope:
      path: "index.html"
    values:
      layout: "default"

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-leaflet
  - jekyll-feed

include:
  - .htaccess
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
  - LICENCE
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - backup-images-*/
  - scripts/
  - '*.bat'

# Contact settings
# 询盘表单后端：Web3Forms（https://web3forms.com，免费 250 次提交/月）
# 到 web3forms.com 输入 sales@ding-yong.com 获取 Access Key 后，替换下面占位符
web3forms_access_key: "f554575e-288a-4f38-aef1-80fda15f66e2"

feed:
  collections:
    products:
      path: "/products.xml"

header_pages:
  - index.md
  - products.md
  - about.md
  - blog.md
  - contact.md

# 自定义CSS
custom_css:
  - /assets/css/custom.css

# 展会档期 —— 控制全站顶部通知条与导航栏入口是否显示
# 展会结束后把 active 改成 false 即可一并撤下（落地页本身保留，可继续作为「往届展会」页使用）。
exhibition:
  active: true
  url: "/jinhan-fair-2026/"
  tag: "Exhibition"
  text: "Meet us at Booth 7B01 · PWTC Expo, Guangzhou · Oct 21–27, 2026"
  link_text: "View invitation"

# 阿里国际站店铺 —— 填入店铺首页 URL 后，页脚社交图标行末尾出现入口；留空则整块不渲染
# 用途：承接只信任平台担保交易的买家。故意不放在产品页 —— 产品页访客已经看中某款产品，
# 此时把他送去阿里，等于带他去一个有公开报价、且页内还有其他供应商推荐位的环境。
alibaba:
  storefront: ""
