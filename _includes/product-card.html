{% assign p = include.product | default: product %}

<div class="product-card" data-category="{{ p.category }}">
  <div class="product-image-wrapper">
    <a href="{{ p.url }}">
      <img class="product-image" 
           src="{{ p.image | default: '/images/placeholder.jpg' }}" 
           alt="{{ p.title }}" 
           loading="lazy">
    </a>
    {% if p.is_new %}
    <span class="badge badge-new">NEW</span>
    {% endif %}
    {% if p.is_bestseller %}
    <span class="badge badge-hot">HOT</span>
    {% endif %}
  </div>
  
  <div class="product-info">
    <h3 class="product-title">
      <a href="{{ p.url }}">{{ p.title }}</a>
    </h3>
    {% if p.series %}
    <p class="product-series">{{ p.series }}</p>
    {% endif %}
    
    {% if p.tags %}
    <div class="product-tags">
      {% for tag in p.tags %}
      <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}
    
    <div class="product-actions">
      <a href="{{ p.url }}" class="btn-view">View Details</a>
      <a href="/contact/?product={{ p.title | url_encode }}" class="btn-quote">Get Quote</a>
    </div>
  </div>
</div>
